server:
  port: ${APP_PORT:7654}

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/equipment_maint?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    username: ${DB_USER:equip}
    password: ${DB_PASSWORD:equip123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      initialization-fail-timeout: 120000
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

app:
  jwt-secret: ${JWT_SECRET:equipment-maintenance-admin-dev-secret-change-me-please-32bytes}
  admin-username: ${ADMIN_USERNAME:admin}
  admin-password: ${ADMIN_PASSWORD:admin123}
  schedule:
    # 厂区时区，周期时刻与跨午夜/夏令时规则均按此时区解释
    zone: ${SCHEDULE_ZONE:Asia/Shanghai}
    # 自动调度总开关，多实例部署可全部开启（唯一索引保证不重复），停机维护时可关
    enabled: ${SCHEDULE_ENABLED:true}
    # 轮询间隔（毫秒）
    poll-interval-ms: ${SCHEDULE_POLL_INTERVAL_MS:60000}
    poll-initial-delay-ms: ${SCHEDULE_POLL_INITIAL_DELAY_MS:15000}
    # 单次扫描允许补发的历史周期上限，更早的漏发周期仅留痕 SKIPPED
    backfill-max: ${SCHEDULE_BACKFILL_MAX:200}
